apiVersion: eacp.dev/v1alpha1
kind: AgentManifest
metadata:
  name: support-assistant
  team: support
  owner: support-leads@example.com
  description: The interactive assistant employees use through LibreChat. Acts on behalf of the logged-in user; the token carries the user as subject and this agent in the actor chain.
spec:
  kind: interactive
  identity:
    clientId: agent-support-assistant
    # User-facing clients this agent is reached through. Their tokens carry the user and the
    # client (azp) but no actor claim, so the control plane resolves the agent from the client:
    # LibreChat, Claude Code's public MCP client, and the scenario runner. The delegation flow
    # (ADR 0023) names the agent in the actor claim instead and needs no entry here.
    actsThrough:
      - librechat
      - eacp-mcp-public
      - demo-runner
  riskTier: medium
  allowedTools:
    - customer-db/*
    - tickets/*
    - web-fetch/fetch
    - email-send/send_email
    - poisoned-demo/*
  allowedModelClasses:
    - external
    - inhouse
  maxClassification: restricted
