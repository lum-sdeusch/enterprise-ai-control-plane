{{- if include "mcp-tool.deployable" . }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ include "mcp-tool.name" . }}
  namespace: {{ include "mcp-tool.namespace" . }}
  labels:
    {{- include "mcp-tool.labels" . | nindent 4 }}
spec:
  mcp:
    targets:
      - name: {{ include "mcp-tool.name" . }}
        static:
          backendRef:
            name: {{ include "mcp-tool.name" . }}
          port: 80
          # agentgateway 1.7: protocol is SSE or StreamableHTTP; path defaults to /mcp for
          # StreamableHTTP and is set explicitly so a server on another path works too. The
          # gateway terminates MCP, so the client-facing /mcp/<name> never reaches the server.
          protocol: StreamableHTTP
          path: {{ include "mcp-tool.mcpPath" . | quote }}
{{- end }}
