{{- /*
credentials.mode: service. The downstream credential lives in the secrets manager and is
materialised as a Secret the workload consumes through envFrom. The model never sees it.
*/ -}}
{{- if eq .Values.spec.credentials.mode "service" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mcp-tool.credentialsSecret" . }}
  namespace: {{ include "mcp-tool.namespace" . }}
  labels:
    {{- include "mcp-tool.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.spec.credentials.secretRef.store | default .Values.platform.secrets.clusterSecretStore }}
  target:
    name: {{ include "mcp-tool.credentialsSecret" . }}
    creationPolicy: Owner
  {{- if .Values.spec.credentials.secretRef.keys }}
  data:
    {{- range .Values.spec.credentials.secretRef.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.spec.credentials.secretRef.path | quote }}
        property: {{ . }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ .Values.spec.credentials.secretRef.path | quote }}
  {{- end }}
{{- end }}
