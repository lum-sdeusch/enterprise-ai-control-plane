{{- if include "mcp-tool.deployable" . }}
{{- /*
Per-server route at /mcp/<name>. The metadata paths are routed too: protected-resource
metadata (RFC 9728) and the authorization-server metadata the gateway serves for this resource
(RFC 8414), under which it also answers client registration (<as-metadata>/client-registration),
hence the prefix match. The aggregate /mcp route lives in the eacp-gateway chart
(platform/charts/eacp-gateway/templates/mcp-virtual.yaml).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-{{ include "mcp-tool.name" . }}
  namespace: {{ include "mcp-tool.namespace" . }}
  labels:
    {{- include "mcp-tool.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.platform.gateway.name }}
      namespace: {{ .Values.platform.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/{{ include "mcp-tool.name" . }}
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp/{{ include "mcp-tool.name" . }}
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/{{ include "mcp-tool.name" . }}
      backendRefs:
        - name: {{ include "mcp-tool.name" . }}
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
