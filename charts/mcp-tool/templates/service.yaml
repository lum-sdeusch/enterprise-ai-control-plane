{{- /*
One Service per server, labelled eacp.dev/mcp-server=true so the platform's virtual MCP backend
(platform/agentgateway/mcp-virtual.yaml) aggregates every onboarded server behind the single
/mcp endpoint, and referenced directly by this server's own AgentgatewayBackend for /mcp/<name>.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-tool.name" . }}
  namespace: {{ include "mcp-tool.namespace" . }}
  labels:
    {{- include "mcp-tool.labels" . | nindent 4 }}
  annotations:
    eacp.dev/mcp-path: {{ include "mcp-tool.mcpPath" . | quote }}
spec:
  selector:
    {{- include "mcp-tool.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: 80
      targetPort: {{ include "mcp-tool.targetPort" . }}
      protocol: TCP
      appProtocol: agentgateway.dev/mcp
