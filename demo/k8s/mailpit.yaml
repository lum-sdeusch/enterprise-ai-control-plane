# Mailpit (MIT): SMTP sink with a web UI, so scenario 5 shows the email arriving after approval.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27   # TODO(pin)
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: demo
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
