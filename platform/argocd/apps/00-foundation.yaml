    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# kmcp is installed from its published Helm charts (CRDs and controller are separate charts),
# not with `kmcp install`; scripts/up.sh records this in the eacp-bringup ConfigMap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kmcp-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kmcp/helm   # OCI; registered in platform/argocd/install-values.yaml
    chart: kmcp-crds
    targetRevision: 0.4.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kmcp-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
