# Wave -3 and -2: things everything else depends on (plus the generated team namespaces, which
# sync in wave 0). Each is a plain Application so a reader
# can see exactly which upstream chart or manifest set is in play.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eacp-generated
  namespace: argocd
  labels:
    eacp.dev/source: repo   # scripts/up.sh retargets these at EACP_REVISION
  annotations:
    # Wave 0, not earlier: the generated ReferenceGrants live in eacp-system (created by the
    # eacp-system chart in wave 0) and keycloak. Team namespaces are first needed by the tools
    # in wave 1.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/generated
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    # agentgateway v1.7.0 builds against sigs.k8s.io/gateway-api v1.7.0-rc.3 (its go.mod) and its
    # docs require at least v1.6.3; v1.7.0 is the matching final release. Standard channel.
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.7.0
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
