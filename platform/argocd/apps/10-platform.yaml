---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eacp-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/charts/eacp-gateway
    helm:
      valueFiles:
        - values.yaml   # profile overlay patches this to values-cloud-gpu.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
