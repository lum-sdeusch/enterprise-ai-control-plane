      chart: langfuse
      targetRevision: 1.5.0   # TODO(verify): chart for Langfuse v4
      helm:
        valueFiles:
          - $values/platform/telemetry/langfuse-values.yaml
    - repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated: { prune: true, selfHeal: true }
