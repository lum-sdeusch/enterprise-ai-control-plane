# Wave -1 and 0: the gateway, identity, enforcement plane, telemetry and models.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: cr.agentgateway.dev/charts   # OCI; registered in platform/argocd/install-values.yaml
    chart: agentgateway
    targetRevision: 1.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# The openbao ClusterSecretStore and the seeder ServiceAccount. Healthy once External Secrets
# Operator can log in to OpenBao; scripts/seed-openbao.sh then writes the demo values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  labels:
    eacp.dev/source: repo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/secret-store
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
