---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.135.0   # TODO(verify)
      helm:
        valueFiles:
          - $values/platform/telemetry/otel-collector-values.yaml
    - repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      targetRevision: 4.0.0   # TODO(verify): chart for Jaeger v2
      helm:
        valueFiles:
          - $values/platform/telemetry/jaeger-values.yaml
    - repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    # S3-compatible store for Langfuse (open item 2 in docs/design.md). Apache-2.0.
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.0.0   # TODO(verify)
    helm:
      values: |
        s3:
          enabled: true
          port: 8333
        master:
          replicas: 1
        volume:
          replicas: 1
        filer:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
