---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    # S3-compatible store for Langfuse (open item 2 in docs/design.md). Apache-2.0.
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.52.0
    helm:
      values: |
        s3:
          enabled: true
          port: 8333
        master:
          replicas: 1
        volume:
          replicas: 1
        filer:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
