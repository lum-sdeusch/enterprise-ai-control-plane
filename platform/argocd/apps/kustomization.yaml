apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every Application, in wave order. The profiles under ../profiles include this directory
# (kustomize refuses to load individual files from outside a kustomization root).
resources:
  - 00-foundation.yaml
  - 10-platform.yaml
  - 20-tools.yaml
  - 30-demo.yaml
