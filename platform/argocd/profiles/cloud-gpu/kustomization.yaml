apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/00-foundation.yaml
  - ../../apps/10-platform.yaml
  - ../../apps/20-tools.yaml
  - ../../apps/30-demo.yaml
patches:
  - target:
      kind: Application
      name: eacp-gateway
    patch: |
      - op: replace
        path: /spec/source/helm/valueFiles
        value: [values.yaml, values-cloud-gpu.yaml]
  - target:
      kind: Application
      name: eacp-system
    patch: |
      - op: replace
        path: /spec/source/helm/valueFiles
        value: [values.yaml, values-cloud-gpu.yaml]
  - target:
      kind: Application
      name: models
    patch: |
      - op: replace
        path: /spec/source/path
        value: platform/models/cloud-gpu
  - target:
      kind: ApplicationSet
      name: eacp-tools
    patch: |
      - op: replace
        path: /spec/template/spec/sources/0/helm/valueFiles/0
        value: $repo/platform/values/cloud-gpu.yaml
  - target:
      kind: Application
      name: keycloak
    patch: |
      - op: replace
        path: /spec/source/path
        value: platform/keycloak/overlays/cloud-gpu
