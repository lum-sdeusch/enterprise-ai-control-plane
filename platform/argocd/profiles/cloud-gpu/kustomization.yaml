apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
patches:
  - target:
      kind: Application
      name: eacp-gateway
    patch: |
      - op: replace
        path: /spec/source/helm/valueFiles
        value: [values.yaml, values-cloud-gpu.yaml]
  - target:
      kind: Application
      name: eacp-system
    patch: |
      - op: replace
        path: /spec/source/helm/valueFiles
        value: [values.yaml, values-cloud-gpu.yaml]
  - target:
      kind: Application
      name: models
    patch: |
      - op: replace
        path: /spec/source/path
        value: platform/models/cloud-gpu
  - target:
      kind: ApplicationSet
      name: eacp-tools
    patch: |
      - op: replace
        path: /spec/template/spec/sources/0/helm/valueFiles/0
        value: $repo/platform/values/cloud-gpu.yaml
  - target:
      kind: Application
      name: keycloak
    patch: |
      - op: replace
        path: /spec/source/path
        value: platform/keycloak-cloud-gpu
  - target:
      kind: Application
      name: gateway
    patch: |
      - op: replace
        path: /spec/source/path
        value: platform/gateway/cloud-gpu
  # The laptop's static seal and self-initialisation do not apply; ticket 14 adds a KMS seal.
  - target:
      kind: Application
      name: openbao
    patch: |
      - op: replace
        path: /spec/sources/0/helm/valueFiles
        value: [$values/platform/openbao/values.yaml]
