apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eacp-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/argocd/profiles/cloud-gpu
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
