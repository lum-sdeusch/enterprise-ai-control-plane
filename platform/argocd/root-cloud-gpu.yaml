apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eacp-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/argocd/profiles/cloud-gpu
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A first bring-up can outlast the controller's sync timeout (900 s) while the foundation
    # waves pull images; the terminated sync counts as failed, and without a retry Argo CD never
    # syncs the same commit again, so waves 0 and 1 would stay unapplied.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
