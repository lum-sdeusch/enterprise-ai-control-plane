apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eacp-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lum-sdeusch/enterprise-ai-control-plane.git
    targetRevision: main
    path: platform/argocd/profiles/laptop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A failed sync is not auto-synced again on the same commit, so it is retried here. A sync the
    # controller stops at its 15-minute timeout is not retried at all; scripts/up.sh restarts it.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
