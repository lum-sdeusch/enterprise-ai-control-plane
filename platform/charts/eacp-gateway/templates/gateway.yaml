# The one gateway. LLM traffic and MCP traffic share it; AgentgatewayModel resources attach to
# the http listener directly, HTTPRoutes attach from the platform and team namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  gatewayClassName: agentgateway
  {{- if .Values.gateway.nodePort }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              # Set on agentgateway-system and on every team-* namespace (generated from
              # teams/*/manifest.yaml by scripts/compile-manifests.py).
              eacp.dev/routes: "true"
# TODO(profile cloud-gpu): add an https listener with a cert-manager issued certificate and
# redirect http to it; the laptop profile stays on plain http behind the kind port mapping.
{{- if .Values.gateway.nodePort }}
---
# Laptop profile: publish the generated proxy Service on a fixed NodePort, which the kind port
# mapping exposes on host port 8080 (scripts/kind-config.yaml). The overlay is merged into the
# Service agentgateway generates for this Gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  service:
    spec:
      type: NodePort
      ports:
        - name: http
          port: 8080
          nodePort: {{ .Values.gateway.nodePort }}
{{- end }}
