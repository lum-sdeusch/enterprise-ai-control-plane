# The single connection string: one virtual MCP server at /mcp that aggregates every onboarded
# tool server. Servers are discovered by the label the mcp-tool chart puts on their Service.
# Tool names are always prefixed with the server name so two servers can never collide.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: eacp-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  mcp:
    prefixMode: Always
    failureMode: FailClosed
    targets:
      - name: eacp
        selector:
          services:
            matchLabels:
              eacp.dev/mcp-server: "true"
          # TODO(verify): whether the selector spans namespaces by default or needs a namespaces
          # selector; team servers live in team-* namespaces, not here.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server/mcp
      backendRefs:
        - name: eacp-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# Resource-server role for the aggregate endpoint: Keycloak JWTs, MCP audience, protected
# resource metadata so clients discover Keycloak, and dynamic client registration proxied to it
# for IDE clients that still use DCR.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-authn
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ .Values.keycloak.issuer | quote }}
          audiences:
            - eacp-mcp
          jwks:
            remote:
              backendRef:
                name: {{ .Values.keycloak.serviceName }}
                kind: Service
                namespace: {{ .Values.keycloak.namespace }}
                port: {{ .Values.keycloak.port }}
              jwksPath: /realms/eacp/protocol/openid-connect/certs
          mcp:
            provider: Keycloak
            resourceMetadata:
              resource: {{ printf "%s/mcp" .Values.gateway.publicUrl | quote }}
              scopesSupported:
                - openid
                - profile
                - email
              bearerMethodsSupported:
                - header
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - "has(jwt.sub)"
---
# Every call through the aggregate goes to the adapter, same as the per-server routes.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-guardrails
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: eacp-mcp
  backend:
    mcp:
      guardrails:
        processors:
          - remote:
              backendRef:
                name: eacp-adapter
                namespace: eacp-system
                port: 4445
              failureMode: FailClosed
            methods:
              tools/call: Full
              tools/list: Response
              prompts/list: Response
              resources/list: Response
---
# The adapter must answer within the policy budget; a slow adapter is a closed gate, not an
# open one.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: eacp-adapter-timeout
  namespace: eacp-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: eacp-adapter
  backend:
    http:
      requestTimeout: 5s
