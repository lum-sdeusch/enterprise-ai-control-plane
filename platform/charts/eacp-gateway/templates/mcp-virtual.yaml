# The single connection string: one virtual MCP server at /mcp that aggregates every onboarded
# tool server. Servers are discovered by the label the mcp-tool chart puts on their Service (whose
# port carries appProtocol agentgateway.dev/mcp); without a namespace selector agentgateway 1.7
# searches only this backend's own namespace, so team namespaces are selected by their label.
# Tool names are always prefixed with the server name so two servers can never collide.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: eacp-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  mcp:
    prefixMode: Always
    failureMode: FailClosed
    targets:
      - name: eacp
        selector:
          namespaces:
            matchExpressions:
              - key: eacp.dev/team
                operator: Exists
          services:
            matchLabels:
              eacp.dev/mcp-server: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      backendRefs:
        - name: eacp-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# Resource-server role for the aggregate endpoint: Keycloak JWTs, MCP audience, and protected
# resource metadata so clients discover Keycloak.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-authn
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ .Values.keycloak.issuer | quote }}
          audiences:
            - eacp-mcp
          jwks:
            remote:
              backendRef:
                name: {{ .Values.keycloak.serviceName }}
                kind: Service
                namespace: {{ .Values.keycloak.namespace }}
                port: {{ .Values.keycloak.port }}
              jwksPath: /realms/eacp/protocol/openid-connect/certs
      # Keycloak is the authorization server in the metadata; see the same block in
      # charts/mcp-tool/templates/policy-authn.yaml for why the gateway does not front it.
      mcp:
        provider: Keycloak
        resourceMetadata:
          resource: {{ printf "%s/mcp" .Values.gateway.publicUrl | quote }}
          authorizationServers:
            - {{ .Values.keycloak.issuer | quote }}
          scopesSupported:
            - openid
            - profile
            - email
          bearerMethodsSupported:
            - header
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - "has(jwt.sub)"
---
# Every call through the aggregate goes to the adapter, same as the per-server routes. The
# metadata block is the hook contract (adapter/internal/extmcp, charts/mcp-tool's
# policy-guardrails.yaml, test/pathway); here prefix is "always" because the aggregate prefixes
# listed names with the server name. guardrails.omitProcessor drops the policy (debugging only;
# see values.yaml).
{{- if not .Values.guardrails.omitProcessor }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-guardrails
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: eacp-mcp
  backend:
    mcp:
      guardrails:
        processors:
          - remote:
              backendRef:
                name: eacp-adapter
                namespace: eacp-system
                port: 4445
              failureMode: FailClosed
              allowedRequestHeaders:
                - traceparent
                - baggage
                - x-eacp-conversation-id
              metadata:
                jwt: jwt
                traceparent: request.headers["traceparent"]
                baggage: request.headers["baggage"]
                conversation_id: request.headers["x-eacp-conversation-id"]
                prefix: '"always"'
                eacp_tool: mcpGuardrails.eacp_tool
                eacp_server: mcpGuardrails.eacp_server
                eacp_conversation_id: mcpGuardrails.eacp_conversation_id
            methods:
              tools/call: Full
              tools/list: Response
              prompts/list: Response
              resources/list: Response
{{- end }}
---
# The adapter must answer within the policy budget; a slow adapter is a closed gate, not an
# open one.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: eacp-adapter-timeout
  namespace: eacp-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: eacp-adapter
  backend:
    http:
      requestTimeout: 5s
