# Detector settings per profile (values: guardrails.profile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: eacp-guardrails-profile
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eacp-guardrails
    app.kubernetes.io/part-of: eacp
data:
  {{- range $k, $v := .Values.guardrails.profile }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eacp-guardrails
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eacp-guardrails
    app.kubernetes.io/part-of: eacp
spec:
  replicas: {{ .Values.guardrails.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eacp-guardrails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eacp-guardrails
        app.kubernetes.io/part-of: eacp
      annotations:
        checksum/profile: {{ .Values.guardrails.profile | toJson | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        runAsGroup: {{ .Values.podSecurity.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guardrails
          image: {{ .Values.images.guardrails | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.guardrails.port }}
          envFrom:
            - configMapRef:
                name: eacp-guardrails-profile
          env:
            - name: EACP_GUARDRAILS_PORT
              value: {{ .Values.guardrails.port | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: eacp-guardrails
            - name: HF_HOME
              value: /cache/hf
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.guardrails.resources | nindent 12 }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eacp-guardrails
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eacp-guardrails
    app.kubernetes.io/part-of: eacp
spec:
  selector:
    app.kubernetes.io/name: eacp-guardrails
  ports:
    - name: http
      port: {{ .Values.guardrails.port }}
      targetPort: http
