profile: cloud-gpu
gateway:
  publicUrl: https://gw.eacp.example.com
keycloak:
  issuer: https://auth.eacp.example.com/realms/eacp
adapter:
  replicas: 2
guardrails:
  replicas: 2
  profile:
    EACP_PROFILE: cloud-gpu
    EACP_GUARD_BASE_URL: http://vllm-guard.models.svc.cluster.local:8000/v1
    EACP_GUARD_MODEL: guard
    EACP_GUARD_TIMEOUT_MS: "800"
    EACP_JUDGE_ENABLED: "true"
    EACP_JUDGE_BASE_URL: http://vllm-judge.models.svc.cluster.local:8000/v1
    EACP_JUDGE_MODEL: judge
    EACP_JUDGE_TIMEOUT_MS: "4000"
    EACP_SENSITIVITY_ENABLED: "false"
    EACP_SENSITIVITY_URL: http://lev.models.svc.cluster.local:8000/v1/systemone
    EACP_PII_ENGINE: presidio
    EACP_PII_SCORE_THRESHOLD: "0.5"
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 6Gi }
policy:
  source: oci
