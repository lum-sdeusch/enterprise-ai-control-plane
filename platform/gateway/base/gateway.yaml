# The one gateway, its own Application in sync wave -1 (with the agentgateway controller) so it
# exists before the eacp-gateway chart attaches models, routes and policies to it. LLM traffic
# and MCP traffic share it; AgentgatewayModel resources attach to
# the http listener directly, HTTPRoutes attach from the platform and team namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              # Set on agentgateway-system and on every team-* namespace (generated from
              # teams/*/manifest.yaml by scripts/compile-manifests.py).
              eacp.dev/routes: "true"
# TODO(profile cloud-gpu): add an https listener with a cert-manager issued certificate and
# redirect http to it; the laptop profile stays on plain http behind the kind port mapping.
