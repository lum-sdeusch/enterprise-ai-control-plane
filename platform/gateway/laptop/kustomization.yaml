apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Laptop profile: the proxy Service is a NodePort that kind publishes on host port 8080.
resources:
  - ../base
  - nodeport.yaml
patches:
  - target:
      kind: Gateway
      name: agentgateway-proxy
    patch: |
      - op: add
        path: /spec/infrastructure
        value:
          parametersRef:
            group: agentgateway.dev
            kind: AgentgatewayParameters
            name: agentgateway-proxy
