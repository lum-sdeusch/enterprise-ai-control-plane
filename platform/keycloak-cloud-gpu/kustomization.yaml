# cloud-gpu overlay of platform/keycloak. It lives outside that directory because kustomize
# rejects an overlay nested inside its own base (cycle).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../keycloak
patches:
  # The laptop NodePort has no place behind a cloud load balancer.
  - target:
      kind: Service
      name: keycloak-nodeport
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: keycloak-nodeport
  - target:
      kind: Keycloak
      name: keycloak
    patch: |
      - op: replace
        path: /spec/hostname/hostname
        value: https://auth.eacp.example.com
      - op: replace
        path: /spec/hostname/strict
        value: true
      - op: replace
        path: /spec/http/httpEnabled
        value: false
      - op: replace
        path: /spec/http/tlsSecret
        value: keycloak-tls
  # Real host name on the certificate; ticket 15 replaces the laptop CA issuer with ACME.
  - target:
      kind: Certificate
      name: keycloak-tls
    patch: |
      - op: replace
        path: /spec/dnsNames
        value: [auth.eacp.example.com]
      - op: remove
        path: /spec/ipAddresses
