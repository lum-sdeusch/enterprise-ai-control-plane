# Keycloak 26.8 through the Keycloak operator. The realm is imported from the generated
# realm-import.yaml. Three features matter for this design (ADR 0023):
#   - standard token exchange (token-exchange-standard:v2): GA and on by default, no flag.
#   - delegation with actor tokens and the `act` claim: token-exchange-delegation, preview in
#     26.8, which needs parameterized-scopes.
#   - identity-assertion-jwt (Enterprise-Managed Authorization): experimental since 26.7.
# Names checked against org.keycloak.common.Profile at tag 26.8.2. Fine-grained admin
# permissions v2 is on by default; the v1 `admin-fine-grained-authz` and legacy `token-exchange`
# features are deprecated and would replace the v2 defaults if enabled.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  image: quay.io/keycloak/keycloak:26.8.2   # TODO(pin)
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
    httpPort: 8080
  hostname:
    # laptop profile: the kind port mapping publishes Keycloak on host port 8081 (NodePort 30081,
    # nodeport.yaml), and CoreDNS resolves the same name inside the cluster (scripts/up.sh), so
    # the issuer is identical for browsers and pods. The cloud-gpu overlay patches this to
    # https://auth.eacp.example.com.
    hostname: http://auth.127.0.0.1.sslip.io:8081
    strict: false
  proxy:
    headers: xforwarded
  features:
    enabled:
      - token-exchange-delegation
      - parameterized-scopes
      - identity-assertion-jwt
  additionalOptions:
    - name: log-level
      value: info
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }
