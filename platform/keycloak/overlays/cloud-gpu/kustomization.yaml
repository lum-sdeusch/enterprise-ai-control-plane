apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../..
patches:
  - target:
      kind: Keycloak
      name: keycloak
    patch: |
      - op: replace
        path: /spec/hostname/hostname
        value: https://auth.eacp.example.com
      - op: replace
        path: /spec/hostname/strict
        value: true
      - op: replace
        path: /spec/http/httpEnabled
        value: false
      - op: add
        path: /spec/http/tlsSecret
        value: keycloak-tls
