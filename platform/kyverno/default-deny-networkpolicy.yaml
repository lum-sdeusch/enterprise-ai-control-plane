# Every team namespace gets a default-deny NetworkPolicy the moment it exists. The mcp-tool
# chart then opens exactly the flows each server needs. Deleting the chart's policy therefore
# isolates the server rather than exposing it.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eacp-default-deny-networkpolicy
spec:
  rules:
    - name: generate-default-deny
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - key: eacp.dev/team
                    operator: Exists
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Ingress, Egress]
