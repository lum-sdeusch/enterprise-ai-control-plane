# Model endpoints for the guardrail service on a CPU-only laptop. The judge is off; the
# sensitivity labeller (Lev) is off. Injection classification uses Qwen3Guard-Gen 0.6B through
# Ollama's OpenAI-compatible API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eacp-guardrails-profile
  namespace: eacp-system
data:
  EACP_PROFILE: laptop
  EACP_GUARD_BASE_URL: http://ollama.models.svc.cluster.local:11434/v1
  EACP_GUARD_MODEL: hf.co/Qwen/Qwen3Guard-Gen-0.6B-GGUF:Q8_0
  EACP_GUARD_TIMEOUT_MS: "1500"
  EACP_JUDGE_ENABLED: "false"
  EACP_SENSITIVITY_ENABLED: "false"
  EACP_PII_ENGINE: regex
  EACP_PII_SCORE_THRESHOLD: "0.5"
