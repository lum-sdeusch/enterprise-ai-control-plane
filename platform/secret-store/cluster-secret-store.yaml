# The one store every ExternalSecret references (ADR 0030). External Secrets Operator logs in to
# OpenBao with its own ServiceAccount through the Kubernetes auth method; the role and the
# read-only policy are created by OpenBao's self-initialisation (platform/argocd/apps/00-foundation.yaml).
# Keys are paths under the KV v2 mount `secret`, for example eacp/gateway/oauth-client.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: eacp
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
