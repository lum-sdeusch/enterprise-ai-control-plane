# ClickHouse for the POC: one StatefulSet, two databases. eacp_audit holds the adapter's
# decision records behind an insert-only user; eacp_logs holds gateway access logs written by
# the collector. Langfuse brings its own ClickHouse through its chart (ADR 0020/0022 note the
# production split: the audit database must be controlled by a different team than operations).
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  labels:
    app.kubernetes.io/part-of: eacp
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: telemetry
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: telemetry
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: eacp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # TODO(pin): pin by digest.
          image: clickhouse/clickhouse-server:25.8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: AUDIT_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-users, key: audit-writer-password } }
            - name: AUDIT_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-users, key: audit-reader-password } }
            - name: LOGS_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-users, key: logs-writer-password } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # clickhouse-init.sh; the entrypoint sources it on the first start only.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: init
          configMap:
            name: clickhouse-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Passwords come from the secrets manager; this ExternalSecret materialises them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
  namespace: telemetry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: clickhouse-users
  dataFrom:
    - extract:
        key: eacp/telemetry/clickhouse
