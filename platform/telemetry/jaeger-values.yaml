# Values for the jaegertracing/jaeger Helm chart (Jaeger v2). Single binary with the embedded
# Badger store for the POC; OpenSearch is the production backend (ADR 0020).
# TODO(verify): chart 4.x value names for the v2 all-in-one layout.
provisionDataStore:
  cassandra: false
  elasticsearch: false
allInOne:
  enabled: true
  extraEnv:
    - name: SPAN_STORAGE_TYPE
      value: badger
    - name: BADGER_EPHEMERAL
      value: "false"
    - name: BADGER_DIRECTORY_VALUE
      value: /badger/data
    - name: BADGER_DIRECTORY_KEY
      value: /badger/key
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
storage:
  type: badger
agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
