# Redis-compatible cache for Langfuse (Valkey, BSD-3). Open item 2 in docs/design.md: verify
# Langfuse against Valkey at build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-valkey
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine   # TODO(pin)
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-valkey
  namespace: telemetry
spec:
  selector:
    app.kubernetes.io/name: langfuse-valkey
  ports:
    - port: 6379
