# kind cluster for the laptop profile. Host ports map to NodePorts the platform exposes:
#   8080  agentgateway (LLM, MCP, approvals)      -> http://gw.127.0.0.1.sslip.io:8080
#   8081  Keycloak (https, laptop CA)             -> https://auth.127.0.0.1.sslip.io:8081
#   3080  LibreChat                               -> http://chat.127.0.0.1.sslip.io:3080
#   8082  Argo CD, 8083 Langfuse, 8084 Jaeger, 8085 Mailpit
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eacp
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }
      - { containerPort: 30081, hostPort: 8081, protocol: TCP }
      - { containerPort: 30082, hostPort: 8082, protocol: TCP }
      - { containerPort: 30083, hostPort: 8083, protocol: TCP }
      - { containerPort: 30084, hostPort: 8084, protocol: TCP }
      - { containerPort: 30085, hostPort: 8085, protocol: TCP }
      - { containerPort: 30380, hostPort: 3080, protocol: TCP }
